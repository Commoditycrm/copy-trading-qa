# QA / Performance — manual only. k6 + Playwright performance scenarios against the local disposable stack.
# Refuses production URLs. Load level, subscriber count and duration are inputs. Uploads sanitized summary
# artifacts only (no tokens/PII). Stress/spike are allowed here (explicitly chosen) but never on shared
# PR/nightly automation. Application repo checked out READ-ONLY as a build context.
name: QA / Performance

on:
  workflow_dispatch:
    inputs:
      load_level:
        description: 'Load level'
        type: choice
        options: [smoke, baseline, stress, spike]
        default: smoke
      subscriber_levels:
        description: 'Fanout subscriber counts (comma-separated)'
        default: '10,25,50,100'
      duration:
        description: 'k6 duration (e.g. 20s, 30s)'
        default: '20s'
      target_confirmation:
        description: "Type LOCAL to confirm the target is the local disposable stack (production is refused)"
        required: true
        default: ''

permissions:
  contents: read
concurrency:
  group: qa-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance:
    name: QA / Performance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QA_ENV: local
      BROKER_MODE: fake
      COMPOSE_NET: copytrading-qa-local_default
    steps:
      - name: Target safety gate (local only; refuse production)
        run: |
          if [ "${{ github.event.inputs.target_confirmation }}" != "LOCAL" ]; then
            echo "::error::target_confirmation must be 'LOCAL'. Refusing."
            exit 1
          fi
      - name: Checkout QA repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: copy-trading-qa
      - name: Checkout application repo (READ-ONLY)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Commoditycrm/copy-trading-app
          ref: qa-branch
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: copy-trading-app
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: copy-trading-qa/automation/package-lock.json
      - name: Install (locked)
        working-directory: copy-trading-qa/automation
        run: npm ci
      - name: Install Chromium
        working-directory: copy-trading-qa/automation
        run: npx playwright install --with-deps chromium
      - name: Bring up full stack (fake broker)
        working-directory: copy-trading-qa/automation
        run: npm run local:up:full
      - name: Wait for health
        working-directory: copy-trading-qa/automation
        run: npm run local:health
      - name: k6 auth load (level → VUs)
        working-directory: copy-trading-qa/automation
        run: |
          case "${{ github.event.inputs.load_level }}" in
            smoke) VUS=2;; baseline) VUS=10;; stress) VUS=30;; spike) VUS=40;; *) VUS=5;;
          esac
          mkdir -p reports/perf
          docker run --rm --network "${COMPOSE_NET}" -v "$PWD/perf/k6:/scripts:ro" \
            -e VUS="$VUS" -e DUR="${{ github.event.inputs.duration }}" \
            grafana/k6:latest run --summary-export=/scripts/../out.json \
            --summary-trend-stats="med,p(90),p(95),p(99),max" /scripts/auth.js \
            | tee reports/perf/k6-auth-summary.txt || true
      - name: Playwright fanout scaling
        working-directory: copy-trading-qa/automation
        env:
          PERF_LEVELS: ${{ github.event.inputs.subscriber_levels }}
        run: npx playwright test --project=perf perf/tests/fanout-scaling.spec.ts --workers=1
      - name: Playwright SSE concurrency
        working-directory: copy-trading-qa/automation
        run: npx playwright test --project=perf perf/tests/sse-concurrency.spec.ts --workers=1
      - name: Tear down stack + volumes
        if: always()
        working-directory: copy-trading-qa/automation
        run: npm run local:down
      - name: Upload sanitized perf summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-performance-summaries
          path: |
            copy-trading-qa/automation/reports/perf
            copy-trading-qa/automation/reports/junit
          retention-days: 14
          if-no-files-found: ignore

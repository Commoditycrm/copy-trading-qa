# QA / Nightly — scheduled full regression + dependency/secret/container scans + a limited local-safe perf
# baseline. Fake broker, local disposable stack only. No stress/soak, no ZAP-active, no production. The
# application repo is checked out READ-ONLY (build context + scan target) and never modified.
name: QA / Nightly

on:
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read
concurrency:
  group: qa-nightly
  cancel-in-progress: false

jobs:
  nightly:
    name: QA / Nightly
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      QA_ENV: local
      BROKER_MODE: fake
    steps:
      - name: Checkout QA repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: copy-trading-qa
      - name: Checkout application repo (READ-ONLY)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Commoditycrm/copy-trading-app
          ref: qa-branch
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: copy-trading-app
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: copy-trading-qa/automation/package-lock.json
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('copy-trading-qa/automation/package-lock.json') }}
      - name: Install (locked)
        working-directory: copy-trading-qa/automation
        run: npm ci
      - name: Install Chromium
        working-directory: copy-trading-qa/automation
        run: npx playwright install --with-deps chromium

      # ---- Scans that do not need the stack -------------------------------------------------------
      - name: npm audit (high+)
        working-directory: copy-trading-qa/automation
        run: npm audit --audit-level=high || true
      - name: gitleaks (secret scan, both repos)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo:ro" \
            zricethezav/gitleaks:latest dir /repo --no-banner --redact || true
      - name: Trivy filesystem scan (repos)
        run: |
          mkdir -p copy-trading-qa/automation/reports/scans
          docker run --rm -v "${{ github.workspace }}:/src:ro" \
            aquasec/trivy:latest fs --quiet --severity HIGH,CRITICAL --scanners vuln,secret \
            --format json -o /dev/stdout /src > copy-trading-qa/automation/reports/scans/trivy-fs.json || true
      - name: pip-audit (app Python deps, best-effort)
        run: |
          REQ=$(find copy-trading-app -maxdepth 3 -name 'requirements*.txt' | head -1)
          if [ -n "$REQ" ]; then
            python -m pip install --quiet pip-audit
            pip-audit -r "$REQ" || true
          else
            echo "no requirements*.txt found — Trivy image scan covers Python packages"
          fi

      # ---- Stack up: build images, scan them, run suites ------------------------------------------
      - name: Bring up full stack (fake broker)
        working-directory: copy-trading-qa/automation
        run: npm run local:up:full
      - name: Wait for health
        working-directory: copy-trading-qa/automation
        run: npm run local:health
      - name: Trivy image scan (backend + frontend)
        run: |
          S=copy-trading-qa/automation/reports/scans
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "${{ github.workspace }}/$S:/out" \
            aquasec/trivy:latest image --quiet --severity HIGH,CRITICAL --scanners vuln \
            --format json -o /out/trivy-backend.json copytrading-qa-local-backend:latest || true
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "${{ github.workspace }}/$S:/out" \
            aquasec/trivy:latest image --quiet --severity HIGH,CRITICAL --scanners vuln \
            --format json -o /out/trivy-frontend.json copytrading-qa-local-frontend:latest || true
      # TD-004: run the @trading group SERIALLY (workers=1) to avoid the OCO CPU-contention timeout.
      - name: Full API regression — non-trading (parallel)
        working-directory: copy-trading-qa/automation
        run: npx playwright test --project=api --grep-invert @trading --workers=4
      - name: Full API regression — trading group (SERIAL, TD-004)
        working-directory: copy-trading-qa/automation
        run: npx playwright test --project=api --grep @trading --workers=1
      - name: Full UI E2E
        working-directory: copy-trading-qa/automation
        run: npx playwright test --project=ui --workers=2
      - name: Full accessibility
        working-directory: copy-trading-qa/automation
        run: npx playwright test --project=a11y --workers=2
      - name: Security Playwright suite (SA-001..007)
        working-directory: copy-trading-qa/automation
        run: npx playwright test --project=api api/tests/security/ --workers=4
      - name: Limited perf baseline (fanout + auth baseline — NO stress/soak)
        working-directory: copy-trading-qa/automation
        run: |
          npx playwright test --project=perf perf/tests/sse-concurrency.spec.ts --workers=1
          docker run --rm --network copytrading-qa-local_default \
            -v "$PWD/perf/k6:/scripts:ro" -e VUS=10 -e DUR=20s \
            grafana/k6:latest run --summary-trend-stats="med,p(95),p(99)" /scripts/auth.js || true

      - name: Tear down stack + volumes
        if: always()
        working-directory: copy-trading-qa/automation
        run: npm run local:down
      - name: Upload reports + scan summaries (redacted)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-nightly-reports
          path: |
            copy-trading-qa/automation/reports/junit
            copy-trading-qa/automation/reports/html
            copy-trading-qa/automation/reports/artifacts
            copy-trading-qa/automation/reports/scans
          retention-days: 14
          if-no-files-found: ignore

# QA / Broker Contract — manual only. Two modes:
#   * fake  (default) — mock/fake broker contract against the local disposable stack. Safe, no secrets.
#   * paper           — Alpaca PAPER account ONLY, behind a gated environment (reviewer approval) with
#                       DevOps-owned secrets. Never IBKR, never a live-money broker. Guarded at runtime by
#                       common/safety.assertPaperSuiteAllowed() (refuses prod + non-paper broker mode).
# The application repo is checked out READ-ONLY as a build context (fake mode only).
name: QA / Broker Contract

on:
  workflow_dispatch:
    inputs:
      broker:
        description: 'Broker under test'
        type: choice
        options: [fake, paper]
        default: fake
      confirm_paper:
        description: "Type RUN-PAPER to confirm a paper-broker run (ignored for fake)"
        required: false
        default: ''

permissions:
  contents: read
concurrency:
  group: qa-broker-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Fake/mock broker contract (safe, default) --------------------------------------------------
  fake-contract:
    name: QA / Broker Contract (fake)
    if: ${{ github.event.inputs.broker == 'fake' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QA_ENV: local
      BROKER_MODE: fake
    steps:
      - name: Checkout QA repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: copy-trading-qa
      - name: Checkout application repo (READ-ONLY)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Commoditycrm/copy-trading-app
          ref: qa-branch
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: copy-trading-app
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: copy-trading-qa/automation/package-lock.json
      - name: Install (locked)
        working-directory: copy-trading-qa/automation
        run: npm ci
      - name: Bring up stack (fake broker + mock broker)
        working-directory: copy-trading-qa/automation
        run: npm run local:up
      - name: Wait for health
        working-directory: copy-trading-qa/automation
        run: npm run local:health
      - name: Broker integration contract (offline)
        working-directory: copy-trading-qa/automation
        run: npx playwright test --project=api --grep @broker --workers=4
      - name: Mock-broker trading lifecycle contract (P0)
        working-directory: copy-trading-qa/automation
        run: npx playwright test --project=api api/tests/trading/broker-lifecycle.spec.ts --workers=2
      - name: Tear down stack + volumes
        if: always()
        working-directory: copy-trading-qa/automation
        run: npm run local:down
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: broker-contract-fake-reports
          path: copy-trading-qa/automation/reports/junit
          retention-days: 7
          if-no-files-found: ignore

  # ---- Alpaca PAPER contract (gated; separate authorization) --------------------------------------
  paper-contract:
    name: QA / Broker Contract (paper)
    if: ${{ github.event.inputs.broker == 'paper' && github.event.inputs.confirm_paper == 'RUN-PAPER' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: alpaca-paper # gated environment — reviewer approval + DevOps-owned paper secrets
    env:
      QA_ENV: qa
      BROKER_MODE: paper
      PAPER_SUITE_AUTHORIZED: 'true'
      # ALPACA_PAPER_KEY / ALPACA_PAPER_SECRET are injected from the gated environment's secrets.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: automation/package-lock.json
      - name: Install (locked)
        working-directory: automation
        run: npm ci
      # Runtime guard (common/safety.assertPaperSuiteAllowed) refuses prod + any non-paper broker; IBKR/live
      # are never selectable here. The @broker-contract paper suite is authored once paper access is granted.
      - name: Paper broker contract (@broker-contract, paper only)
        working-directory: automation
        run: npx playwright test --grep @broker-contract
